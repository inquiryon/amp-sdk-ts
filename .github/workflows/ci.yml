# CI for amp-sdk-ts (OSS-006).
#
# Requires no private services or production secrets. The live-compat job
# checks out the public amp-core and amp-community source repositories and is
# a hard gate: checkout, installation, startup, or scenario failures
# fail CI.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines declares >=18.17 for consumers (they never invoke the test
        # tooling below), but node --test --import needs 18.19+ — CI tests
        # the oldest version the *dev toolchain* actually supports.
        node-version: ['18.19', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  live-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The default GITHUB_TOKEN is scoped to this repo only and 404s on a
      # second private repo, so these use a fine-grained PAT (Contents:
      # Read-only, scoped to amp-core + amp-community) instead.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/amp-core
          path: vendor/amp-core
          token: ${{ secrets.AMP_CORE_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/amp-community
          path: vendor/amp-community
          token: ${{ secrets.AMP_CORE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install amp-core and amp-community from reviewed source
        run: |
          python -m pip install -e ./vendor/amp-core -e ./vendor/amp-community
          python -c "import amp_core, amp_community"
      - name: Live compatibility scenarios
        run: npm run test:compat
        env:
          AMP_COMMUNITY_PYTHON: python3
          AMP_COMPAT_REQUIRED: '1'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Build package
        run: npm run build
      - name: Pack and inspect contents
        run: |
          npm pack
          tar tzf amp-sdk-*.tgz | sort > /tmp/pack-contents.txt
          cat /tmp/pack-contents.txt
          # Fail if anything beyond the declared "files" allowlist sneaks in.
          if grep -vE '^package/(dist/|LICENSE|NOTICE|README\.md|CHANGELOG\.md|package\.json)' /tmp/pack-contents.txt; then
            echo "::error::unexpected file(s) in npm package"
            exit 1
          fi
      - name: Install from packed tarball in a clean project
        run: |
          mkdir -p /tmp/install-test && cd /tmp/install-test
          npm init -y
          npm install $GITHUB_WORKSPACE/amp-sdk-*.tgz
          node -e "const {AmpClient} = require('@amp/sdk'); console.log(typeof AmpClient)" --input-type=module 2>/dev/null || \
          node --input-type=module -e "import {AmpClient} from '@amp/sdk'; console.log(typeof AmpClient)"
      - name: Dependency/license audit
        run: |
          npm ls --omit=dev --all
          npm audit --omit=dev

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release hygiene checks (secrets, forbidden files, markers, dependency directories)
        run: bash scripts/check_release_hygiene.sh .
